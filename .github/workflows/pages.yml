name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel, so the last push to
# main is always the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Deploying a broken build to the device on the kitchen table is worse
      # than not deploying, so the tests gate the publish too.
      - run: npm test
      - run: npm run build
      # Pages has to be switched on once, by a human, in
      # Settings › Pages › Build and deployment › Source › GitHub Actions.
      # This step's `enablement: true` option is meant to do that
      # automatically, but creating a Pages site is not something a workflow's
      # GITHUB_TOKEN is permitted to do ("Resource not accessible by
      # integration"), so it only turned a missing setting into a confusing
      # failure. Once the setting is on, this step is a no-op that just reads
      # the site's configuration back.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
